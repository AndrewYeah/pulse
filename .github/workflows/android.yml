name: Android checks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Download libbox 1.13.14
        shell: bash
        run: |
          mkdir -p app/libs
          curl --fail --location \
            https://jitpack.io/com/github/singbox-android/libbox/1.13.14/libbox-1.13.14.aar \
            --output app/libs/libbox.aar
          echo "D8EE7620047E4485199A9CF8DB30E67D1497534117F1774A93C0696068B7B012  app/libs/libbox.aar" | sha256sum --check
      - run: chmod +x gradlew
      - run: ./gradlew testDebugUnitTest lintDebug assembleDebug --no-daemon --no-build-cache
